name: Build Macro Mod (Fabric 1.21.10)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate project files
        run: |
          set -e
          mkdir -p src/main/java/com/macromod
          mkdir -p src/main/resources/assets/macromod/lang

          FAPI=$(curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+1\.21\.10</version>' | sed -e 's/<version>//' -e 's/<\/version>//' | tail -n 1 || true)
          if [ -z "$FAPI" ]; then FAPI="0.138.3+1.21.10"; fi
          echo "Fabric API version: $FAPI"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'macromod'
          EOF

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx3G
          org.gradle.parallel=true
          minecraft_version=1.21.10
          loader_version=0.18.1
          fabric_version=$FAPI
          mod_version=1.0.0
          maven_group=com.macromod
          archives_base_name=macromod
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.11-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "macromod",
            "version": "${version}",
            "name": "Macro Mod",
            "description": "Macro keybind: tahan satu tombol untuk menjalankan urutan tombol lain. Buka GUI dengan /macro.",
            "authors": ["MacroMod"],
            "license": "CC0-1.0",
            "environment": "client",
            "entrypoints": {
              "client": ["com.macromod.MacroMod"]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          {
            echo '{'
            for i in $(seq 1 12); do
              sep=","
              if [ "$i" = "12" ]; then sep=""; fi
              echo "  \"key.macromod.slot$i\": \"Macro Slot $i\"$sep"
            done
            echo '}'
          } > src/main/resources/assets/macromod/lang/en_us.json

          cat > src/main/java/com/macromod/MacroMod.java <<'EOF'
          package com.macromod;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.KeyMapping;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class MacroMod implements ClientModInitializer {
              public static final String MOD_ID = "macromod";
              public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);
              public static final KeyMapping[] KEYS = new KeyMapping[MacroConfig.SLOTS];

              private static boolean openRequested = false;

              @Override
              public void onInitializeClient() {
                  MacroConfig.load();

                  for (int i = 0; i < MacroConfig.SLOTS; i++) {
                      KeyMapping mapping = new KeyMapping(
                              "key." + MOD_ID + ".slot" + (i + 1),
                              InputConstants.Type.KEYSYM,
                              GLFW.GLFW_KEY_UNKNOWN,
                              KeyMapping.Category.MISC);
                      KeyBindingHelper.registerKeyBinding(mapping);
                      KEYS[i] = mapping;
                  }

                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {
                      dispatcher.register(ClientCommandManager.literal("macro").executes(context -> {
                          openRequested = true;
                          return 1;
                      }));
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (openRequested) {
                          openRequested = false;
                          client.setScreen(new MacroListScreen());
                      }
                      MacroEngine.tick(client);
                  });
              }
          }
          EOF

          cat > src/main/java/com/macromod/MacroConfig.java <<'EOF'
          package com.macromod;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          public final class MacroConfig {
              public static final int SLOTS = 12;
              public static final int MAX_STEPS = 40;
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              public static final class Entry {
                  public boolean created = false;
                  public boolean enabled = true;
                  public boolean repeat = true;
                  public int holdTicks = 2;
                  public int gapTicks = 1;
                  public List<String> steps = new ArrayList<>();
              }

              public static Entry[] entries = fresh();

              private MacroConfig() {
              }

              private static Entry[] fresh() {
                  Entry[] arr = new Entry[SLOTS];
                  for (int i = 0; i < SLOTS; i++) {
                      arr[i] = new Entry();
                  }
                  return arr;
              }

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("macromod.json");
              }

              public static int clamp(int v, int lo, int hi) {
                  return Math.max(lo, Math.min(hi, v));
              }

              public static void load() {
                  entries = fresh();
                  Path p = file();
                  if (!Files.exists(p)) {
                      return;
                  }
                  try (Reader r = Files.newBufferedReader(p)) {
                      Entry[] loaded = GSON.fromJson(r, Entry[].class);
                      if (loaded == null) {
                          return;
                      }
                      for (int i = 0; i < SLOTS && i < loaded.length; i++) {
                          Entry e = loaded[i];
                          if (e == null) {
                              continue;
                          }
                          if (e.steps == null) {
                              e.steps = new ArrayList<>();
                          }
                          e.holdTicks = clamp(e.holdTicks, 1, 40);
                          e.gapTicks = clamp(e.gapTicks, 0, 40);
                          entries[i] = e;
                      }
                  } catch (Exception ex) {
                      MacroMod.LOGGER.error("Gagal membaca config macro", ex);
                  }
              }

              public static void save() {
                  try {
                      Path p = file();
                      Files.createDirectories(p.getParent());
                      try (Writer w = Files.newBufferedWriter(p)) {
                          GSON.toJson(entries, w);
                      }
                  } catch (Exception ex) {
                      MacroMod.LOGGER.error("Gagal menyimpan config macro", ex);
                  }
              }

              public static String label(String token) {
                  switch (token) {
                      case "USE":
                          return "Kanan";
                      case "ATTACK":
                          return "Kiri";
                      case "JUMP":
                          return "Lompat";
                      case "SNEAK":
                          return "Jongkok";
                      case "DROP":
                          return "Buang";
                      case "SWAP":
                          return "Tukar";
                      default:
                          return token;
                  }
              }
          }
          EOF

          cat > src/main/java/com/macromod/MacroEngine.java <<'EOF'
          package com.macromod;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.Options;

          public final class MacroEngine {
              private static int active = -1;
              private static int idx = 0;
              private static int holdLeft = 0;
              private static int gapLeft = 0;
              private static InputConstants.Key heldKey = null;
              private static final boolean[] wasDown = new boolean[MacroConfig.SLOTS];

              private MacroEngine() {
              }

              public static void tick(Minecraft mc) {
                  boolean[] down = new boolean[MacroConfig.SLOTS];
                  for (int i = 0; i < MacroConfig.SLOTS; i++) {
                      KeyMapping km = MacroMod.KEYS[i];
                      down[i] = km != null && km.isDown();
                  }
                  try {
                      runTick(mc, down);
                  } finally {
                      System.arraycopy(down, 0, wasDown, 0, down.length);
                  }
              }

              private static void runTick(Minecraft mc, boolean[] down) {
                  boolean canRun = mc.player != null && mc.level != null && mc.screen == null;
                  if (!canRun) {
                      stop();
                      return;
                  }

                  if (active == -1) {
                      for (int i = 0; i < MacroConfig.SLOTS; i++) {
                          MacroConfig.Entry cand = MacroConfig.entries[i];
                          if (!cand.created || !cand.enabled || cand.steps.isEmpty()) {
                              continue;
                          }
                          boolean trigger = cand.repeat ? down[i] : (down[i] && !wasDown[i]);
                          if (trigger) {
                              active = i;
                              idx = 0;
                              holdLeft = 0;
                              gapLeft = 0;
                              break;
                          }
                      }
                      if (active == -1) {
                          return;
                      }
                  }

                  MacroConfig.Entry e = MacroConfig.entries[active];
                  if (!e.created || !e.enabled || e.steps.isEmpty()) {
                      stop();
                      return;
                  }
                  boolean triggerDown = down[active];
                  if (e.repeat && !triggerDown) {
                      stop();
                      return;
                  }

                  if (holdLeft > 0) {
                      holdLeft--;
                      if (holdLeft == 0) {
                          releaseHeld();
                          gapLeft = Math.max(0, e.gapTicks);
                      }
                      return;
                  }

                  if (gapLeft > 0) {
                      gapLeft--;
                      return;
                  }

                  if (idx >= e.steps.size()) {
                      if (e.repeat && triggerDown) {
                          idx = 0;
                      } else {
                          stop();
                          return;
                      }
                  }

                  String token = e.steps.get(idx);
                  idx++;
                  KeyMapping km = resolve(mc.options, token);
                  if (km == null) {
                      return;
                  }
                  InputConstants.Key key = KeyBindingHelper.getBoundKeyOf(km);
                  KeyMapping.set(key, true);
                  KeyMapping.click(key);
                  heldKey = key;
                  holdLeft = holdFor(e, token);
              }

              private static int holdFor(MacroConfig.Entry e, String token) {
                  switch (token) {
                      case "USE":
                      case "ATTACK":
                      case "JUMP":
                      case "SNEAK":
                          return Math.max(1, e.holdTicks);
                      default:
                          return 1;
                  }
              }

              private static KeyMapping resolve(Options o, String token) {
                  switch (token) {
                      case "USE":
                          return o.keyUse;
                      case "ATTACK":
                          return o.keyAttack;
                      case "JUMP":
                          return o.keyJump;
                      case "SNEAK":
                          return o.keyShift;
                      case "DROP":
                          return o.keyDrop;
                      case "SWAP":
                          return o.keySwapOffhand;
                      default:
                          if (token.length() == 1) {
                              char c = token.charAt(0);
                              if (c >= '1' && c <= '9') {
                                  return o.keyHotbarSlots[c - '1'];
                              }
                          }
                          return null;
                  }
              }

              private static void releaseHeld() {
                  if (heldKey != null) {
                      KeyMapping.set(heldKey, false);
                      heldKey = null;
                  }
              }

              private static void stop() {
                  releaseHeld();
                  active = -1;
                  idx = 0;
                  holdLeft = 0;
                  gapLeft = 0;
              }
          }
          EOF

          cat > src/main/java/com/macromod/MacroListScreen.java <<'EOF'
          package com.macromod;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;
          import org.lwjgl.glfw.GLFW;

          public class MacroListScreen extends Screen {
              private int page;
              private int perPage = 4;
              private int pages = 1;
              private int left = 0;
              private int rowCount = 0;
              private final int[] rowSlot = new int[16];
              private final int[] rowY = new int[16];

              public MacroListScreen() {
                  this(0);
              }

              public MacroListScreen(int page) {
                  super(Component.literal("Macro"));
                  this.page = page;
              }

              private void openSelf() {
                  this.minecraft.setScreen(new MacroListScreen(page));
              }

              @Override
              protected void init() {
                  perPage = Math.max(2, Math.min(6, (this.height - 72) / 26));
                  pages = (MacroConfig.SLOTS + perPage - 1) / perPage;
                  if (page >= pages) {
                      page = pages - 1;
                  }
                  if (page < 0) {
                      page = 0;
                  }

                  int rowW = Math.min(this.width - 16, 330);
                  left = (this.width - rowW) / 2;
                  int right = left + rowW;
                  int y = 26;
                  rowCount = 0;

                  int start = page * perPage;
                  for (int n = 0; n < perPage; n++) {
                      int slot = start + n;
                      if (slot >= MacroConfig.SLOTS) {
                          break;
                      }
                      final int s = slot;
                      MacroConfig.Entry e = MacroConfig.entries[slot];
                      rowSlot[rowCount] = slot;
                      rowY[rowCount] = y;
                      rowCount++;

                      if (!e.created) {
                          this.addRenderableWidget(Button.builder(Component.literal("Buat"), b -> {
                              MacroConfig.Entry ne = MacroConfig.entries[s];
                              ne.created = true;
                              ne.enabled = true;
                              MacroConfig.save();
                              this.minecraft.setScreen(new MacroEditScreen(s, page, false));
                          }).bounds(right - 60, y, 60, 20).build());
                      } else {
                          this.addRenderableWidget(Button.builder(Component.literal("Edit"), b -> {
                              this.minecraft.setScreen(new MacroEditScreen(s, page, false));
                          }).bounds(right - 106, y, 44, 20).build());

                          this.addRenderableWidget(Button.builder(Component.literal(e.enabled ? "ON" : "OFF"), b -> {
                              MacroConfig.Entry ne = MacroConfig.entries[s];
                              ne.enabled = !ne.enabled;
                              MacroConfig.save();
                              openSelf();
                          }).bounds(right - 60, y, 36, 20).build());

                          this.addRenderableWidget(Button.builder(Component.literal("X"), b -> {
                              MacroConfig.entries[s] = new MacroConfig.Entry();
                              MacroConfig.save();
                              KeyMapping km = MacroMod.KEYS[s];
                              this.minecraft.options.setKey(km, InputConstants.Type.KEYSYM.getOrCreate(GLFW.GLFW_KEY_UNKNOWN));
                              KeyMapping.resetMapping();
                              openSelf();
                          }).bounds(right - 22, y, 22, 20).build());
                      }
                      y += 26;
                  }

                  int fy = this.height - 26;
                  int cx = this.width / 2;
                  this.addRenderableWidget(Button.builder(Component.literal("<"), b -> {
                      if (page > 0) {
                          page--;
                      }
                      openSelf();
                  }).bounds(cx - 110, fy, 24, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(">"), b -> {
                      if (page < pages - 1) {
                          page++;
                      }
                      openSelf();
                  }).bounds(cx - 84, fy, 24, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal("Selesai"), b -> this.onClose())
                          .bounds(cx + 10, fy, 100, 20).build());
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {
                  super.render(g, mouseX, mouseY, partialTick);
                  g.drawCenteredString(this.font, Component.literal("Macro"), this.width / 2, 10, 0xFFFFFFFF);

                  for (int n = 0; n < rowCount; n++) {
                      int slot = rowSlot[n];
                      MacroConfig.Entry e = MacroConfig.entries[slot];
                      String text;
                      if (!e.created) {
                          text = (slot + 1) + ". (kosong)";
                      } else {
                          KeyMapping km = MacroMod.KEYS[slot];
                          String k = km.isUnbound() ? "-" : km.getTranslatedKeyMessage().getString();
                          text = (slot + 1) + ". [" + k + "] " + (e.repeat ? "Tahan" : "Sekali") + ", "
                                  + e.steps.size() + " langkah" + (e.enabled ? "" : " (mati)");
                      }
                      g.drawString(this.font, Component.literal(text), left, rowY[n] + 6, 0xFFFFFFFF);
                  }

                  int cx = this.width / 2;
                  g.drawString(this.font, Component.literal("Hal " + (page + 1) + "/" + pages), cx - 54, this.height - 20, 0xFFFFFFFF);
              }
          }
          EOF

          cat > src/main/java/com/macromod/MacroEditScreen.java <<'EOF'
          package com.macromod;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.network.chat.Component;
          import org.lwjgl.glfw.GLFW;

          public class MacroEditScreen extends Screen {
              private final int slot;
              private final int listPage;
              private final boolean listening;

              private int left = 0;
              private int rowW = 0;
              private int seqY = 0;
              private int holdY = 0;
              private int gapY = 0;

              public MacroEditScreen(int slot, int listPage, boolean listening) {
                  super(Component.literal("Macro " + (slot + 1)));
                  this.slot = slot;
                  this.listPage = listPage;
                  this.listening = listening;
              }

              private void reopen(boolean listen) {
                  this.minecraft.setScreen(new MacroEditScreen(slot, listPage, listen));
              }

              private void backToList() {
                  this.minecraft.setScreen(new MacroListScreen(listPage));
              }

              private Button stepButton(MacroConfig.Entry e, String label, String token, int x, int y, int w) {
                  return Button.builder(Component.literal(label), b -> {
                      if (e.steps.size() < MacroConfig.MAX_STEPS) {
                          e.steps.add(token);
                      }
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(x, y, w, 20).build();
              }

              @Override
              protected void init() {
                  final MacroConfig.Entry e = MacroConfig.entries[slot];
                  rowW = Math.min(this.width - 16, 300);
                  left = (this.width - rowW) / 2;
                  int right = left + rowW;
                  int step = this.height >= 230 ? 22 : 20;
                  int y = 16;

                  KeyMapping km = MacroMod.KEYS[slot];
                  String keyName = km.isUnbound() ? "belum diatur" : km.getTranslatedKeyMessage().getString();
                  String keyLabel = listening ? "Tekan tombol... (Esc = batal)" : "Tombol pemicu: " + keyName;
                  this.addRenderableWidget(Button.builder(Component.literal(keyLabel), b -> reopen(!listening))
                          .bounds(left, y, rowW, 20).build());
                  y += step;

                  String modeLabel = e.repeat ? "Mode: TAHAN (diulang selama ditahan)" : "Mode: TEKAN (sekali jalan)";
                  this.addRenderableWidget(Button.builder(Component.literal(modeLabel), b -> {
                      e.repeat = !e.repeat;
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(left, y, rowW, 20).build());
                  y += step;

                  holdY = y;
                  this.addRenderableWidget(Button.builder(Component.literal("-"), b -> {
                      e.holdTicks = MacroConfig.clamp(e.holdTicks - 1, 1, 40);
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(right - 70, y, 20, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal("+"), b -> {
                      e.holdTicks = MacroConfig.clamp(e.holdTicks + 1, 1, 40);
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(right - 20, y, 20, 20).build());
                  y += step;

                  gapY = y;
                  this.addRenderableWidget(Button.builder(Component.literal("-"), b -> {
                      e.gapTicks = MacroConfig.clamp(e.gapTicks - 1, 0, 40);
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(right - 70, y, 20, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal("+"), b -> {
                      e.gapTicks = MacroConfig.clamp(e.gapTicks + 1, 0, 40);
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(right - 20, y, 20, 20).build());
                  y += step;

                  seqY = y + 2;
                  y += 14;

                  int hw = Math.max(10, (rowW - 16) / 9);
                  int hx = left + (rowW - (hw * 9 + 16)) / 2;
                  for (int i = 1; i <= 9; i++) {
                      String t = String.valueOf(i);
                      this.addRenderableWidget(stepButton(e, t, t, hx + (i - 1) * (hw + 2), y, hw));
                  }
                  y += step;

                  int bw = (rowW - 4) / 3;
                  this.addRenderableWidget(stepButton(e, "Klik Kanan", "USE", left, y, bw));
                  this.addRenderableWidget(stepButton(e, "Klik Kiri", "ATTACK", left + bw + 2, y, bw));
                  this.addRenderableWidget(stepButton(e, "Lompat", "JUMP", left + 2 * (bw + 2), y, bw));
                  y += step;

                  this.addRenderableWidget(stepButton(e, "Jongkok", "SNEAK", left, y, bw));
                  this.addRenderableWidget(stepButton(e, "Buang Item", "DROP", left + bw + 2, y, bw));
                  this.addRenderableWidget(stepButton(e, "Tukar Tangan", "SWAP", left + 2 * (bw + 2), y, bw));
                  y += step;

                  this.addRenderableWidget(Button.builder(Component.literal("Hapus Akhir"), b -> {
                      if (!e.steps.isEmpty()) {
                          e.steps.remove(e.steps.size() - 1);
                      }
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(left, y, bw, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal("Kosongkan"), b -> {
                      e.steps.clear();
                      MacroConfig.save();
                      reopen(false);
                  }).bounds(left + bw + 2, y, bw, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal("Selesai"), b -> backToList())
                          .bounds(left + 2 * (bw + 2), y, bw, 20).build());
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (listening) {
                      int code = event.key();
                      if (code != GLFW.GLFW_KEY_ESCAPE) {
                          KeyMapping km = MacroMod.KEYS[slot];
                          this.minecraft.options.setKey(km, InputConstants.Type.KEYSYM.getOrCreate(code));
                          KeyMapping.resetMapping();
                      }
                      reopen(false);
                      return true;
                  }
                  return super.keyPressed(event);
              }

              @Override
              public void onClose() {
                  backToList();
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {
                  super.render(g, mouseX, mouseY, partialTick);
                  MacroConfig.Entry e = MacroConfig.entries[slot];
                  int right = left + rowW;

                  g.drawCenteredString(this.font, this.title, this.width / 2, 4, 0xFFFFFFFF);

                  g.drawString(this.font, Component.literal("Tahan (tick)"), left, holdY + 6, 0xFFFFFFFF);
                  g.drawCenteredString(this.font, Component.literal(String.valueOf(e.holdTicks)), right - 35, holdY + 6, 0xFFFFFFFF);

                  g.drawString(this.font, Component.literal("Jeda (tick)"), left, gapY + 6, 0xFFFFFFFF);
                  g.drawCenteredString(this.font, Component.literal(String.valueOf(e.gapTicks)), right - 35, gapY + 6, 0xFFFFFFFF);

                  StringBuilder sb = new StringBuilder("Urutan: ");
                  if (e.steps.isEmpty()) {
                      sb.append("(kosong)");
                  } else {
                      for (int i = 0; i < e.steps.size(); i++) {
                          if (i > 0) {
                              sb.append(" > ");
                          }
                          sb.append(MacroConfig.label(e.steps.get(i)));
                      }
                  }
                  String text = sb.toString();
                  if (this.font.width(text) > rowW) {
                      while (text.length() > 6 && this.font.width("..." + text) > rowW) {
                          text = text.substring(1);
                      }
                      text = "..." + text;
                  }
                  g.drawString(this.font, Component.literal(text), left, seqY, 0xFFFFFFFF);
              }
          }
          EOF

          find src -type f | sort

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: List output
        run: ls -la build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: macromod-1.21.10
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
